<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620">
    <rect width="920" height="620" fill="#f8fafc"/>
    
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e293b"/>
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1d4ed8"/>
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#059669"/>
        </marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
        </filter>
    </defs>

    <!-- Header Banner -->
    <rect x="30" y="20" width="860" height="46" rx="8" fill="#1e3a8a"/>
    <text x="460" y="49" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Figure 3.6: IEEE State Machine Diagram — Judicial Case Lifecycle</text>

    <!-- Start Node (center Y = 250) -->
    <circle cx="55" cy="250" r="16" fill="#1e3a8a"/>
    <line x1="71" y1="250" x2="120" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="95" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">upload</text>

    <!-- State 1: DRAFT_INGESTION (X: 120, width: 170, Y: 215, height: 70 -> Center Y = 250) -->
    <rect x="120" y="215" width="170" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="205" y="255" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">DRAFT_INGESTION</text>

    <!-- Branch to Duplicate Abort (X: 205, Y: 215 up to Y: 135) -->
    <line x1="205" y1="215" x2="205" y2="135" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
    <rect x="145" y="160" width="120" height="18" rx="3" fill="#ffffff" opacity="0.9"/>
    <text x="205" y="173" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">[Hash Duplicate]</text>
    
    <!-- State: ABORT (409) -->
    <rect x="140" y="85" width="130" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="205" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">ABORT (409)</text>

    <!-- Transition to PENDING_APPROVAL (X: 290 to 370, Y: 250) -->
    <line x1="290" y1="250" x2="370" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="330" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">[Unique]</text>

    <!-- State 2: PENDING_APPROVAL (X: 370, width: 180, Y: 210, height: 80 -> Center Y = 250) -->
    <rect x="370" y="210" width="180" height="80" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="460" y="244" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">PENDING_APPROVAL</text>
    <text x="460" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle">In Review Queue</text>

    <!-- Reject Branch (X: 460, from Y: 290 down to 400) -->
    <line x1="460" y1="290" x2="460" y2="400" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
    <rect x="395" y="333" width="130" height="18" rx="3" fill="#ffffff" opacity="0.9"/>
    <text x="460" y="346" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">[Staff Rejects]</text>
    
    <!-- State: REJECTED -->
    <rect x="395" y="400" width="130" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="460" y="430" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">REJECTED</text>

    <!-- Transition to PUBLISHED (X: 550 to 660, Y: 250) -->
    <line x1="550" y1="250" x2="660" y2="250" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <rect x="560" y="230" width="90" height="18" rx="3" fill="#ffffff" opacity="0.9"/>
    <text x="605" y="243" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669" text-anchor="middle">[Staff Approves]</text>

    <!-- State 3: PUBLISHED (X: 660, width: 230, Y: 180, height: 140 -> Center Y = 250) -->
    <rect x="660" y="180" width="230" height="140" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="775" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">PUBLISHED</text>
    <line x1="660" y1="222" x2="890" y2="222" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="775" y="246" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle">&#x2022; Indexed in Search</text>
    <text x="775" y="271" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle">&#x2022; Seal Endorsement Active</text>
    <text x="775" y="296" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle">&#x2022; On-Demand Stream Verify</text>

    <!-- Tamper Alert Path (X: 775, Y: 320 to 450) -->
    <line x1="775" y1="320" x2="775" y2="450" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
    <rect x="680" y="375" width="190" height="20" rx="3" fill="#ffffff" opacity="0.9"/>
    <text x="775" y="390" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">[Byte Tamper Mismatch]</text>

    <!-- State 4: QUARANTINED (X: 675, width: 200, Y: 450, height: 65) -->
    <rect x="675" y="450" width="200" height="65" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="775" y="478" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">QUARANTINED</text>
    <text x="775" y="500" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">Access Blocked &amp; Alert Logged</text>
</svg>
