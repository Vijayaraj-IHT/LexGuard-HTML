<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="1100" height="750">
    <rect width="1100" height="750" fill="#f8fafc"/>
    
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e293b"/>
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1d4ed8"/>
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#059669"/>
        </marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
        </filter>
    </defs>

    <rect x="30" y="20" width="1040" height="50" rx="8" fill="#1e3a8a"/>
    <text x="550" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Figure 3.4: IEEE Sequence Diagram — Hybrid Precedent Search &amp; Grounded RAG</text>

    <!-- Lifelines Header -->
    <rect x="60" y="100" width="120" height="40" rx="6" fill="#1e293b"/>
    <text x="120" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Advocate UI</text>

    <rect x="250" y="100" width="130" height="40" rx="6" fill="#1e3a8a"/>
    <text x="315" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">SearchAPI (:8000)</text>

    <rect x="450" y="100" width="130" height="40" rx="6" fill="#1e3a8a"/>
    <text x="515" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">DraftAPI (:8000)</text>

    <rect x="650" y="100" width="140" height="40" rx="6" fill="#0284c7"/>
    <text x="720" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EmbeddingService</text>

    <rect x="850" y="100" width="120" height="40" rx="6" fill="#7c3aed"/>
    <text x="910" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">LocalLLM (Ollama)</text>

    <!-- Lifeline dashed tracks -->
    <line x1="120" y1="140" x2="120" y2="700" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="315" y1="140" x2="315" y2="700" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="515" y1="140" x2="515" y2="700" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="720" y1="140" x2="720" y2="700" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="910" y1="140" x2="910" y2="700" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Step 1: Precedent Search -->
    <line x1="120" y1="180" x2="315" y2="180" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="217" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">1. POST /api/v1/search (query, filters)</text>

    <line x1="315" y1="215" x2="720" y2="215" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
    <text x="517" y="207" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle">2. encode_query(query) [LRU Cache Check]</text>

    <line x1="720" y1="250" x2="315" y2="250" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>
    <text x="517" y="242" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle">3. Return 384-d dense vector</text>

    <rect x="280" y="275" width="220" height="30" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <text x="390" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">SQL select &amp; Score Fusion: 0.6*V + 0.4*K</text>

    <line x1="315" y1="330" x2="120" y2="330" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="217" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">4. JSON: Ranked Cases with Match Scores</text>

    <!-- Step 2: Draft Assistant Grounding -->
    <line x1="120" y1="390" x2="515" y2="390" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="317" y="382" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">5. POST /api/v1/draft/analyze (petition_text)</text>

    <line x1="515" y1="430" x2="720" y2="430" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
    <text x="617" y="422" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle">6. encode_text_cached(petition_text)</text>

    <line x1="720" y1="465" x2="515" y2="465" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>
    <text x="617" y="457" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle">7. Return dense semantic vector</text>

    <rect x="475" y="490" width="220" height="28" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <text x="585" y="508" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Fetch top 3 grounded precedents from DB</text>

    <line x1="515" y1="545" x2="910" y2="545" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="712" y="537" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#6d28d9" text-anchor="middle">8. analyze_draft_gap(text, grounded_precedents)</text>

    <line x1="910" y1="595" x2="515" y2="595" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="712" y="587" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#6d28d9" text-anchor="middle">9. Missing grounds, model_source="local_llm"</text>

    <line x1="515" y1="640" x2="120" y2="640" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="317" y="632" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">10. Render Gap Analysis &amp; Verified Citations</text>
</svg>