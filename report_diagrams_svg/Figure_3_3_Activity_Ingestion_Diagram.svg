<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" width="900" height="1080">
    <rect width="900" height="1080" fill="#f8fafc"/>
    
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e293b"/>
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1d4ed8"/>
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#059669"/>
        </marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
        </filter>
    </defs>

    <rect x="30" y="20" width="840" height="50" rx="8" fill="#1e3a8a"/>
    <text x="450" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Figure 3.3: IEEE Activity Diagram — Ingestion, 3-Pass NLP &amp; Approval</text>

    <!-- Start -->
    <circle cx="450" cy="110" r="16" fill="#059669"/>
    <line x1="450" y1="126" x2="450" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Action 1: Upload & Stream 64KB -->
    <rect x="300" y="160" width="300" height="45" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="450" y="188" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Stream PDF in 64KB Binary Chunks</text>
    <line x1="450" y1="205" x2="450" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Action 2: SHA-256 Digest -->
    <rect x="320" y="240" width="260" height="45" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="450" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Compute Cryptographic SHA-256</text>
    <line x1="450" y1="285" x2="450" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Decision: Duplicate? -->
    <polygon points="450,320 540,355 450,390 360,355" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="450" y="359" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#78350f" text-anchor="middle">Hash in DB?</text>

    <!-- Branch Duplicate (Yes) -->
    <line x1="540" y1="355" x2="700" y2="355" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="610" y="345" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">[Yes: Duplicate]</text>
    <rect x="700" y="332" width="160" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="780" y="360" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">409 Conflict Abort</text>
    <circle cx="780" cy="420" r="14" fill="#ffffff" stroke="#991b1b" stroke-width="2"/>
    <circle cx="780" cy="420" r="8" fill="#991b1b"/>
    <line x1="780" y1="378" x2="780" y2="406" stroke="#991b1b" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- Branch Unique (No) -->
    <line x1="450" y1="390" x2="450" y2="430" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="460" y="415" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669">[No: Unique Record]</text>

    <!-- 3-Pass NLP -->
    <rect x="250" y="430" width="400" height="150" rx="10" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" filter="url(#shadow)"/>
    <rect x="250" y="430" width="400" height="30" rx="10" fill="#1e3a8a"/>
    <text x="450" y="450" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">AUTOMATED 3-PASS EXTRACTION PIPELINE</text>
    <text x="270" y="480" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#1e293b">&#x25AA; Pass 1: Structural Parsing (CNR, Court, Parties, Date)</text>
    <text x="270" y="510" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#1e293b">&#x25AA; Pass 2: Legal NER (IPC, CrPC, NI Act, Section Tags)</text>
    <text x="270" y="540" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#1e293b">&#x25AA; Pass 3: Rhetorical Ratio Decidendi via Local LLM</text>
    <text x="270" y="565" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#1e293b">&#x25AA; Compute 384-d InLegalBERT Embedding Vector</text>
    <line x1="450" y1="580" x2="450" y2="615" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Action 3: Pending Queue -->
    <rect x="290" y="615" width="320" height="45" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="450" y="643" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Insert to ApprovalQueue (status: pending)</text>
    <line x1="450" y1="660" x2="450" y2="695" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Senior Review Decision -->
    <polygon points="450,695 560,735 450,775 340,735" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="450" y="739" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#78350f" text-anchor="middle">Senior Review?</text>

    <!-- Reject Path -->
    <line x1="340" y1="735" x2="160" y2="735" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="240" y="725" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">[Reject]</text>
    <rect x="60" y="712" width="100" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="110" y="740" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">Archived</text>

    <!-- Approve Path -->
    <line x1="450" y1="775" x2="450" y2="815" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="460" y="798" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669">[Approve &amp; Seal]</text>

    <!-- Action 4: Endorse Seal & Chain -->
    <rect x="250" y="815" width="400" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="450" y="845" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">Endorse Seal &amp; Append Hash-Chained Audit Block</text>
    <line x1="450" y1="865" x2="450" y2="905" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Action 5: Published in Repository -->
    <rect x="280" y="905" width="340" height="45" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="450" y="933" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Indexed in Active Precedent Repository</text>
    <line x1="450" y1="950" x2="450" y2="990" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- End State -->
    <circle cx="450" cy="1006" r="16" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
    <circle cx="450" cy="1006" r="10" fill="#1e3a8a"/>
</svg>