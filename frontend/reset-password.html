<!DOCTYPE html>
<html lang="en" data-theme="light" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Reset Password — LexGuard Judicial Repository</title>

  <!-- Google Fonts & CDN CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

  <!-- LexGuard Stylesheets -->
  <link rel="stylesheet" href="css/lexguard.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container" style="max-width: 480px;">
    <div class="w-100">

      <!-- Emblem Header -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 rounded-circle p-3 mb-3 border border-danger border-opacity-25 shadow-sm">
          <i class="bi bi-key-fill text-danger fs-2"></i>
        </div>
        <h1 class="h3 font-serif fw-bold text-light mb-1">LexGuard</h1>
        <p class="text-secondary small mb-0">Set New Judicial Credentials</p>
        <span class="badge badge-court-madras mt-2">Madras High Court &amp; Supreme Court</span>
      </div>

      <!-- Reset Card -->
      <div class="card card-judicial shadow-lg border-secondary border-opacity-25 p-4">
        <h2 class="h5 fw-bold text-light mb-1">Update Password</h2>
        <p class="text-secondary small mb-3">Enter your new secure password to finalize identity reset.</p>

        <!-- Status Message Banner -->
        <div id="reset-alert" class="alert d-none py-2 px-3 small" role="alert"></div>

        <form id="reset-password-form">
          <input type="hidden" id="reset-token" name="token">
          
          <div class="mb-3">
            <label for="reset-email" class="form-label text-secondary small fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                <i class="bi bi-envelope"></i>
              </span>
              <input type="email" class="form-control" id="reset-email" required readonly style="background-color: rgba(248, 250, 252, 0.8);">
            </div>
          </div>

          <!-- Advocate Bar Council Re-confirmation -->
          <div class="mb-3 d-none" id="advocate-cred-group">
            <label for="reset-credential" class="form-label text-secondary small fw-semibold">Confirm Bar Council Enrollment ID</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                <i class="bi bi-person-badge"></i>
              </span>
              <input type="text" class="form-control font-mono" id="reset-credential" placeholder="e.g. BAR-DL-2024-9912">
            </div>
          </div>

          <div class="mb-3">
            <label for="reset-new-password" class="form-label text-secondary small fw-semibold">New Password</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                <i class="bi bi-shield-lock"></i>
              </span>
              <input type="password" class="form-control" id="reset-new-password" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password">
              <button class="btn btn-judicial-outline" type="button" id="toggle-new-password" title="Show/Hide Password">
                <i class="bi bi-eye" id="toggle-new-password-icon"></i>
              </button>
            </div>
          </div>

          <div class="mb-4">
            <label for="reset-confirm-password" class="form-label text-secondary small fw-semibold">Confirm New Password</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                <i class="bi bi-check2-circle"></i>
              </span>
              <input type="password" class="form-control" id="reset-confirm-password" placeholder="Re-enter new password" required minlength="8" autocomplete="new-password">
            </div>
          </div>

          <button type="submit" class="btn btn-gold w-100 py-2 d-flex align-items-center justify-content-center gap-2" id="reset-submit-btn">
            <span>Update Password</span>
            <i class="bi bi-arrow-right"></i>
          </button>
        </form>

        <div class="text-center mt-4">
          <p class="text-secondary small mb-0">
            Return to judicial sign in?
            <a href="login.html" class="text-warning text-decoration-none fw-semibold">Sign in here</a>
          </p>
        </div>
      </div>

      <!-- Footer Disclaimer -->
      <div class="text-center mt-4 text-secondary small">
        <p class="mb-0">Certified Judicial Digital Repository &bull; In accordance with High Court Rules</p>
      </div>

    </div>
  </div>

  <!-- CDN JS Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

  <!-- LexGuard Core & Reset Scripts -->
  <script src="js/lexguard-core.js"></script>
  <script src="js/lexguard-toast.js"></script>
  <script src="js/lexguard-api.js"></script>
  <script>
    $(document).ready(function () {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const email = urlParams.get('email');

      if (!token || !email) {
        $('#reset-alert').removeClass('d-none').addClass('alert-danger').html(`
          <i class="bi bi-exclamation-triangle-fill me-1"></i>Invalid or missing recovery token. Please request a new link from the <a href="forgot-password.html" class="alert-link">recovery portal</a>.
        `);
        $('#reset-submit-btn').prop('disabled', true);
      } else {
        $('#reset-token').val(token);
        $('#reset-email').val(email);
      }

      // Password toggle
      $('#toggle-new-password').on('click', function () {
        const $input = $('#reset-new-password');
        const $icon = $('#toggle-new-password-icon');
        if ($input.attr('type') === 'password') {
          $input.attr('type', 'text');
          $icon.removeClass('bi-eye').addClass('bi-eye-slash');
        } else {
          $input.attr('type', 'password');
          $icon.removeClass('bi-eye-slash').addClass('bi-eye');
        }
      });

      // Submit new password
      $('#reset-password-form').on('submit', function (e) {
        e.preventDefault();
        const t = $('#reset-token').val();
        const em = $('#reset-email').val();
        const p1 = $('#reset-new-password').val();
        const p2 = $('#reset-confirm-password').val();
        const cred = $('#reset-credential').val().trim();
        const $btn = $('#reset-submit-btn');
        const $alert = $('#reset-alert');

        if (p1 !== p2) {
          $alert.removeClass('d-none').addClass('alert-danger').html('<i class="bi bi-x-circle me-1"></i>Passwords do not match.');
          return;
        }

        if (p1.length < 8) {
          $alert.removeClass('d-none').addClass('alert-danger').html('<i class="bi bi-x-circle me-1"></i>Password must be at least 8 characters.');
          return;
        }

        $alert.addClass('d-none').removeClass('alert-danger alert-success');
        $btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm me-2"></span>Updating Credentials...');

        LG.api.request({
          url: '/auth/reset-password',
          method: 'POST',
          data: {
            token: t,
            email: em,
            new_password: p1,
            credential_id: cred || null
          }
        }).done(function (res) {
          $alert.removeClass('d-none').addClass('alert-success').html(`
            <i class="bi bi-check-circle-fill me-1"></i>${LG.utils.escapeHtml(res.message)}
            <div class="mt-2 font-semibold">Redirecting to sign in portal...</div>
          `);
          LG.toast('Password updated successfully! Redirecting...', 'success');
          setTimeout(function () {
            window.location.href = 'login.html';
          }, 2000);
        }).fail(function (xhr) {
          $btn.prop('disabled', false).html('<span>Update Password</span> <i class="bi bi-arrow-right"></i>');
          let err = 'Unable to reset password.';
          if (xhr.responseJSON && xhr.responseJSON.detail) {
            err = xhr.responseJSON.detail;
          }
          $alert.removeClass('d-none').addClass('alert-danger').html(`
            <i class="bi bi-shield-x me-1"></i>${LG.utils.escapeHtml(err)}
          `);
          LG.toast(err, 'danger');
        });
      });
    });
  </script>
</body>
</html>
