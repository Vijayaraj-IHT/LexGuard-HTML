<!DOCTYPE html>
<html lang="en" data-theme="light" data-bs-theme="light">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://code.jquery.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' http://127.0.0.1:8000; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <title>Access Denied (403) · LexGuard</title>

  <!-- Google Fonts & CDN CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

  <!-- LexGuard Styles -->
  <link rel="stylesheet" href="css/lexguard.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="lg-auth-layout">

  <div class="lg-main">
    <div class="container text-center" style="max-width: 520px;">
      
      <div class="d-inline-flex align-items-center justify-content-center mb-4" style="width: 72px; height: 72px; border-radius: 20px; background: rgba(248, 113, 113, 0.15); border: 1px solid rgba(248, 113, 113, 0.35); box-shadow: 0 4px 20px rgba(248, 113, 113, 0.2);">
        <i class="bi bi-shield-slash fs-1 text-danger"></i>
      </div>

      <h1 class="h3 font-serif fw-bold text-light mb-2">403 · Privileged Access Required</h1>
      <p class="text-secondary mb-4">
        Your current session role does not possess authorization to view this judicial administration workstation. This module is strictly restricted to designated Court Staff and Registrars.
      </p>

      <div class="card card-judicial p-3 mb-4 text-start">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <span class="text-secondary small">Current Active Role:</span>
          <span id="current-role-badge"></span>
        </div>
        <div class="d-flex align-items-center justify-content-between">
          <span class="text-secondary small">Required Permission:</span>
          <span class="badge badge-gold"><i class="bi bi-shield-check me-1"></i>court_staff</span>
        </div>
      </div>

      <div class="d-flex justify-content-center gap-3">
        <a href="search.html" class="btn btn-gold">
          <i class="bi bi-arrow-left me-1"></i>Back to Legal Search
        </a>
        <button type="button" class="btn btn-judicial-outline" id="switch-account-btn">
          <i class="bi bi-box-arrow-right me-1"></i>Switch Account
        </button>
      </div>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="js/lexguard-core.js"></script>
  <script src="js/lexguard-auth.js"></script>
  <script src="js/pages/unauthorized.js"></script>
</body>
</html>
