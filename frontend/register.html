<!DOCTYPE html>
<html lang="en" data-theme="light" data-bs-theme="light">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://code.jquery.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' http://127.0.0.1:8000; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <title>Register · LexGuard Judicial Platform</title>

  <!-- Google Fonts & CDN CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

  <!-- LexGuard Styles -->
  <link rel="stylesheet" href="css/lexguard.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="lg-auth-layout" data-active-page="register">

  <div class="lg-main">
    <div class="container" style="max-width: 500px;">

      <!-- Brand Header -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); box-shadow: 0 4px 16px rgba(245, 158, 11, 0.35);">
          <i class="bi bi-shield-fill-check fs-2 text-dark"></i>
        </div>
        <h1 class="h3 font-serif fw-bold text-light mb-1">LexGuard</h1>
        <p class="text-secondary small mb-0">Judicial Repository &amp; Cryptographic Verification</p>
      </div>

      <!-- Register Card -->
      <div class="card card-judicial shadow-lg border-secondary border-opacity-25 p-4">
        <h2 class="h5 fw-bold text-light mb-1">Create Research Account</h2>
        <p class="text-secondary small mb-4">Register for authenticated precedent access &amp; drafting.</p>

        <!-- Alert Container -->
        <div id="register-alert" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

        <form id="register-form">
          <div class="mb-3">
            <label for="reg-name" class="form-label text-secondary small fw-semibold">Full Legal Name</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                <i class="bi bi-person"></i>
              </span>
              <input type="text" class="form-control" id="reg-name" placeholder="Adv. Rajesh Kumar" required>
            </div>
          </div>

          <div class="mb-3">
            <label for="reg-email" class="form-label text-secondary small fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                <i class="bi bi-envelope"></i>
              </span>
              <input type="email" class="form-control" id="reg-email" placeholder="rajesh@madrasbar.org" required>
            </div>
          </div>

          <div class="mb-3">
            <label for="reg-role" class="form-label text-secondary small fw-semibold">Designated Role</label>
            <select class="form-select" id="reg-role" required>
              <option value="advocate" selected>Advocate / Legal Counsel</option>
              <option value="scholar">Legal Scholar / Academic Researcher</option>
              <option value="public">Public Citizen / Litigant</option>
            </select>
            <div class="form-text text-secondary" style="font-size: 0.75rem;">
              * Note: Judicial Court Staff accounts require pre-provisioning by the Registrar.
            </div>
          </div>

          <div class="mb-3" id="credential-group">
            <label for="reg-credential" class="form-label text-secondary small fw-semibold" id="credential-label">
              Bar Council Enrollment Number
            </label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                <i class="bi bi-card-text"></i>
              </span>
              <input type="text" class="form-control" id="reg-credential" placeholder="MS/1234/2020">
            </div>
          </div>

          <div class="row g-2 mb-4">
            <div class="col-md-6">
              <label for="reg-password" class="form-label text-secondary small fw-semibold">Password</label>
              <input type="password" class="form-control" id="reg-password" placeholder="••••••••" required minlength="6">
            </div>
            <div class="col-md-6">
              <label for="reg-confirm-password" class="form-label text-secondary small fw-semibold">Confirm Password</label>
              <input type="password" class="form-control" id="reg-confirm-password" placeholder="••••••••" required minlength="6">
            </div>
          </div>

          <button type="submit" class="btn btn-gold w-100 py-2 d-flex align-items-center justify-content-center gap-2" id="register-submit-btn">
            <span>Register Account</span>
            <i class="bi bi-arrow-right"></i>
          </button>
        </form>

        <div class="text-center mt-4">
          <p class="text-secondary small mb-0">
            Already have an account?
            <a href="login.html" class="text-warning text-decoration-none fw-semibold">Sign In</a>
          </p>
        </div>
      </div>

    </div>
  </div>

  <!-- CDN JS Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

  <!-- LexGuard Core & Page Scripts -->
  <script src="js/lexguard-core.js"></script>
  <script src="js/lexguard-auth.js"></script>
  <script src="js/lexguard-toast.js"></script>
  <script src="js/lexguard-api.js"></script>
  <script src="js/pages/register.js"></script>
</body>
</html>
